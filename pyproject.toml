[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directerior"
version = "0.2.0"
requires-python = ">=3.10"

[project.scripts]
directerior = "expman:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
    "directerior_core",
    "directerior_guards",
    "directerior_history",
    "directerior_lifecycle",
    "directerior_migrate",
    "directerior_ops",
    "directerior_project",
    "directerior_storage",
    "expman",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.4",
    "pytest>=8.3.5",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["scripts", "tests"]
extraPaths = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
